name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q brain tests evals
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check committed files for secrets
        shell: bash
        run: |
          if git grep -nE 'BRAIN_TOKEN=.+|client_secret"[[:space:]]*:[[:space:]]*".+|refresh_token"[[:space:]]*:[[:space:]]*".+' -- ':!*.md'; then
            echo "Potential credential committed to the repository."
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Verify production bundle is committed
        run: git diff --exit-code -- dist
